spring:
  datasource:
    url: jdbc:h2:mem:commercehub_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

commercehub:
  frontend-origins: "http://127.0.0.1:5301,http://localhost:5301"
  tax-basis-points: 0

app:
  environment: test
