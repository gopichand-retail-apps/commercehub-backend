name: CommerceHub Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercehub-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: mvn -B -Pquality -Dspring.profiles.active=test verify

      - name: Check Java source line length
        run: sh scripts/check-java-lines.sh

      - name: Checkstyle quality profile
        run: mvn -B -Pquality validate

      - name: Package
        run: mvn -B -DskipTests package

  event-service-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: commercehub_be02_ci
          POSTGRES_USER: synthetic_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ["17442:5432"]
        options: >-
          --health-cmd "pg_isready -U synthetic_ci -d commercehub_be02_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      kafka:
        image: apache/kafka:3.9.1
        ports: ["17982:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:17982
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    env:
      BE02_TEST_DB_URL: jdbc:postgresql://127.0.0.1:17442/commercehub_be02_ci
      BE02_TEST_DB_USER: synthetic_ci
      BE02_TEST_DB_PASSWORD: synthetic_ci_only
      BE02_TEST_KAFKA: 127.0.0.1:17982
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify with service PostgreSQL and Kafka
        run: mvn -B -Pexternal-engine,quality -Dspring.profiles.active=test verify
