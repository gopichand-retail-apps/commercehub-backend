server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:5302}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: commercehub-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.local/commercehub;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

app:
  environment: ${APP_ENV:development}

commercehub:
  frontend-origins: "${FRONTEND_ORIGINS:http://127.0.0.1:5301,http://localhost:5301}"
  tax-basis-points: ${DEMO_TAX_BASIS_POINTS:0}
  synthetic-session-ttl: ${SYNTHETIC_SESSION_TTL:PT8H}
  rate-limit:
    max-requests: ${GUEST_RATE_LIMIT_MAX_REQUESTS:30}
    window-seconds: ${GUEST_RATE_LIMIT_WINDOW_SECONDS:60}
