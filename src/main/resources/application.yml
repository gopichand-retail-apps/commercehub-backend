server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:5302}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

spring:
  kafka:
    bootstrap-servers: ${COMMERCEHUB_KAFKA_BOOTSTRAP:127.0.0.1:17992}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.request.size: 65536
        max.block.ms: 3000
        delivery.timeout.ms: 4000
        request.timeout.ms: 2000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 25
      properties:
        max.partition.fetch.bytes: 65536
        fetch.max.bytes: 262144
    listener:
      ack-mode: manual_immediate
  application:
    name: commercehub-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.local/commercehub;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

app:
  environment: ${APP_ENV:development}

commercehub:
  events:
    enabled: ${COMMERCEHUB_EVENTS_ENABLED:false}
    workers-enabled: ${COMMERCEHUB_EVENTS_WORKERS_ENABLED:true}
    operator-origin: ${COMMERCEHUB_OPERATOR_ORIGIN:http://127.0.0.1:17302}
  frontend-origins: "${FRONTEND_ORIGINS:http://127.0.0.1:5301,http://localhost:5301}"
  tax-basis-points: ${DEMO_TAX_BASIS_POINTS:0}
  synthetic-session-ttl: ${SYNTHETIC_SESSION_TTL:PT8H}
  rate-limit:
    max-requests: ${GUEST_RATE_LIMIT_MAX_REQUESTS:30}
    window-seconds: ${GUEST_RATE_LIMIT_WINDOW_SECONDS:60}
